<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Atul Tameshwari, Frontend Engineer at Plane. Building interfaces that feel inevitable.">
  <style>
    .icon { font: 700 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #191919; letter-spacing: -1px; }
    .name { font: 700 50px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #191919; letter-spacing: -1.5px; }
    .tag { font: 400 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #787774; }
    .serif { font: italic 400 25px 'Lyon-Text', 'Iowan Old Style', Georgia, ui-serif, 'Times New Roman', serif; fill: #191919; }
    .caret { font: 300 24px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #191919; animation: blink 1.1s steps(1) infinite; }
    .prop { font: 400 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #787774; }
    .value { font: 400 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #191919; }
    .tagtext { font: 400 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #191919; }
    .rise { opacity: 0; animation: rise 0.8s cubic-bezier(0.21, 0.47, 0.32, 0.98) forwards; }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite reverse; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .rise, .caret, .float, .float2 { animation: none; opacity: 1; } }
  </style>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#191919" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="fadeX" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade"><rect width="1000" height="150" fill="url(#fadeX)"/></mask>
    <clipPath id="frame"><rect x="0.5" y="0.5" rx="8" width="999" height="419"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="420" fill="#ffffff"/>
    <rect width="1000" height="150" fill="#f7f7f5"/>
    <rect width="1000" height="150" fill="url(#dots)" mask="url(#fade)"/>
    <line x1="0" x2="1000" y1="150" y2="150" stroke="#e9e9e7"/>
    <g fill="#ffffff" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g class="float"><circle cx="742" cy="82" r="30"/></g>
      <g class="float2"><rect x="806" y="40" width="58" height="58" rx="6" transform="rotate(12 835 69)"/></g>
      <g class="float"><path d="M890 112 l26 -46 l26 46 z"/></g>
      <path d="M660 122 q14 -16 28 0 t28 0 t28 0" fill="none"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" rx="8" width="999" height="419" fill="none" stroke="#e9e9e7"/>

  <g class="rise" style="animation-delay:0ms">
    <rect x="60" y="108" width="76" height="76" rx="10" fill="#ffffff" stroke="#e9e9e7"/>
    <text x="98" y="157" class="icon" text-anchor="middle">AT</text>
  </g>
  <text x="56" y="252" class="name rise" style="animation-delay:120ms">Atul Tameshwari</text>
  <text x="58" y="292" class="tag rise" style="animation-delay:240ms">Building interfaces that feel <tspan class="serif">inevitable.</tspan><tspan class="caret" dx="2">|</tspan></text>
  <g class="rise" style="animation-delay:360ms">
    <g transform="translate(60, 324)" fill="none" stroke="#787774" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="0.7" y="3.2" width="12.6" height="9.6" rx="2"/><path d="M4.8 3.2V1.6h4.4v1.6M0.7 7.4h12.6"/></g>
    <text x="84" y="336" class="prop">Role</text>
    <text x="196" y="336" class="value">Frontend Engineer at Plane</text>
  </g>
  <g class="rise" style="animation-delay:440ms">
    <g transform="translate(60, 356)" fill="none" stroke="#787774" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13.2s4.6-4.1 4.6-7.6a4.6 4.6 0 0 0-9.2 0c0 3.5 4.6 7.6 4.6 7.6z"/><circle cx="7" cy="5.6" r="1.6"/></g>
    <text x="84" y="368" class="prop">Location</text>
    <text x="196" y="368" class="value">Hyderabad, India</text>
  </g>
  <g class="rise" style="animation-delay:520ms">
    <g transform="translate(60, 388)" fill="none" stroke="#787774" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h8M5 7h8M5 11.5h8"/><circle cx="1.6" cy="2.5" r="0.6"/><circle cx="1.6" cy="7" r="0.6"/><circle cx="1.6" cy="11.5" r="0.6"/></g>
    <text x="84" y="400" class="prop">Focus</text>
    <rect x="196" y="384" width="108" height="22" rx="4" fill="#f1f1ef"/><text x="204" y="400" class="tagtext">Design systems</text><rect x="310" y="384" width="102" height="22" rx="4" fill="#f1f1ef"/><text x="318" y="400" class="tagtext">Accessibility</text><rect x="418" y="384" width="95" height="22" rx="4" fill="#f1f1ef"/><text x="426" y="400" class="tagtext">AI-driven UX</text>
  </g>
</svg>
