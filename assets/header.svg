<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Atul Tameshwari, Frontend Engineer at Plane. Building interfaces that feel inevitable.">
  <style>
    .pill { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #a1a1aa; }
    .name { font: 700 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fafafa; letter-spacing: -3px; }
    .tag { font: 400 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #a1a1aa; letter-spacing: -0.5px; }
    .serif { font: italic 400 38px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; }
    .meta { font: 400 17px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #71717a; letter-spacing: 0.5px; }
    .rise { opacity: 0; animation: rise 0.8s cubic-bezier(0.21, 0.47, 0.32, 0.98) forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 77px 74px; }
    .orbit { animation: spin 18s linear infinite; transform-origin: 850px 180px; }
    .orbit2 { animation: spin 30s linear infinite reverse; transform-origin: 850px 180px; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rise, .pulse, .orbit, .orbit2 { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ember" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffb36b"/>
      <stop offset="100%" stop-color="#ff5a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ff7a45" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fadeX" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade"><rect width="1000" height="360" fill="url(#fadeX)"/></mask>
    <clipPath id="frame"><rect x="0.5" y="0.5" rx="20" width="999" height="359"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="360" fill="#0a0a0b"/>
    <rect width="1000" height="360" fill="url(#dots)" mask="url(#fade)"/>
    <rect width="1000" height="360" fill="url(#glow)"/>
    <circle cx="850" cy="180" r="60" fill="none" stroke="#fafafa" stroke-opacity="0.09"/>
    <circle cx="850" cy="180" r="100" fill="none" stroke="#fafafa" stroke-opacity="0.075"/>
    <circle cx="850" cy="180" r="140" fill="none" stroke="#fafafa" stroke-opacity="0.06"/>
    <circle cx="850" cy="180" r="180" fill="none" stroke="#fafafa" stroke-opacity="0.045"/>
    <g class="orbit"><circle cx="850" cy="40" r="5" fill="#ff7a45"/><circle cx="850" cy="40" r="12" fill="#ff7a45" fill-opacity="0.18"/></g>
    <g class="orbit2"><circle cx="850" cy="280" r="3" fill="#fafafa" fill-opacity="0.5"/></g>
  </g>
  <rect x="0.5" y="0.5" rx="20" width="999" height="359" fill="none" stroke="#232327"/>

  <g class="rise" style="animation-delay:0ms">
    <rect x="60" y="56" rx="18" width="356" height="36" fill="#111113" stroke="#232327"/>
    <circle class="pulse" cx="80" cy="74" r="5" fill="#34d399"/>
    <text x="96" y="80" class="pill">Frontend Engineer at Plane · India</text>
  </g>
  <text x="56" y="182" class="name rise" style="animation-delay:120ms">Atul Tameshwari</text>
  <text x="60" y="240" class="tag rise" style="animation-delay:240ms">Building interfaces that feel <tspan class="serif" fill="url(#ember)">inevitable.</tspan></text>
  <text x="60" y="306" class="meta rise" style="animation-delay:360ms">design systems  /  accessibility  /  ai-driven ux</text>
</svg>
