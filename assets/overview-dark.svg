<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="GitHub stats and top languages">
<svg x="0" y="0" width="492" height="270" viewBox="0 0 492 270" role="img" aria-label="GitHub stats">
  <style>
    .label { font: 600 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #ededed; }
    .num { font: 700 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #ededed; letter-spacing: -0.8px; }
    .text { font: 400 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #9b9b9b; }
    .meta { font: 400 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #6f6f6f; font-variant-numeric: tabular-nums; }
    .rise { opacity: 0; animation: rise 0.6s cubic-bezier(0.21, 0.47, 0.32, 0.98) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <defs>
  </defs>
  <rect x="0.5" y="0.5" rx="8" width="491" height="269" fill="#191919" stroke="#2f2f2f"/>
  <text x="28" y="38" class="label">GitHub stats</text>
  <g transform="translate(28, 94)"><g class="rise" style="animation-delay:100ms">
    <text x="0" y="0" class="num">1,118</text>
    <text x="0" y="22" class="text">Commits</text>
    <text x="0" y="38" class="meta">past year</text>
  </g></g>
  <g transform="translate(178, 94)"><g class="rise" style="animation-delay:180ms">
    <text x="0" y="0" class="num">71</text>
    <text x="0" y="22" class="text">Pull requests</text>
    <text x="0" y="38" class="meta">all time</text>
  </g></g>
  <g transform="translate(328, 94)"><g class="rise" style="animation-delay:260ms">
    <text x="0" y="0" class="num">3</text>
    <text x="0" y="22" class="text">Contributed to</text>
    <text x="0" y="38" class="meta">repositories</text>
  </g></g>
  <g transform="translate(28, 180)"><g class="rise" style="animation-delay:340ms">
    <text x="0" y="0" class="num">2</text>
    <text x="0" y="22" class="text">Stars</text>
    <text x="0" y="38" class="meta">earned</text>
  </g></g>
  <g transform="translate(178, 180)"><g class="rise" style="animation-delay:420ms">
    <text x="0" y="0" class="num">3</text>
    <text x="0" y="22" class="text">Issues</text>
    <text x="0" y="38" class="meta">opened</text>
  </g></g>
  <g transform="translate(328, 180)"><g class="rise" style="animation-delay:500ms">
    <text x="0" y="0" class="num">27</text>
    <text x="0" y="22" class="text">Followers</text>
    <text x="0" y="38" class="meta">on GitHub</text>
  </g></g>
</svg>
