<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-label="GitHub stats">
  <style>
    .label { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #71717a; letter-spacing: 1.5px; text-transform: uppercase; }
    .num { font: 650 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #fafafa; letter-spacing: -1px; }
    .text { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #a1a1aa; }
    .mono { font: 400 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #71717a; }
    .rise { opacity: 0; animation: rise 0.6s cubic-bezier(0.21, 0.47, 0.32, 0.98) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ember" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffb36b"/>
      <stop offset="100%" stop-color="#ff5a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" rx="14" width="399" height="269" fill="#111113" stroke="#232327"/>
  <rect x="0.5" y="0.5" rx="14" width="399" height="269" fill="url(#glow)"/>
  <circle cx="28" cy="32" r="3" fill="#ff7a45"/>
  <text x="40" y="36" class="label">GitHub stats</text>
  <g transform="translate(28, 94)"><g class="rise" style="animation-delay:100ms">
    <text x="0" y="0" class="num">1,054</text>
    <text x="0" y="22" class="text">Commits</text>
    <text x="0" y="38" class="mono">past year</text>
  </g></g>
  <g transform="translate(150, 94)"><g class="rise" style="animation-delay:180ms">
    <text x="0" y="0" class="num">69</text>
    <text x="0" y="22" class="text">Pull requests</text>
    <text x="0" y="38" class="mono">all time</text>
  </g></g>
  <g transform="translate(272, 94)"><g class="rise" style="animation-delay:260ms">
    <text x="0" y="0" class="num">3</text>
    <text x="0" y="22" class="text">Contributed to</text>
    <text x="0" y="38" class="mono">repositories</text>
  </g></g>
  <g transform="translate(28, 180)"><g class="rise" style="animation-delay:340ms">
    <text x="0" y="0" class="num">2</text>
    <text x="0" y="22" class="text">Stars</text>
    <text x="0" y="38" class="mono">earned</text>
  </g></g>
  <g transform="translate(150, 180)"><g class="rise" style="animation-delay:420ms">
    <text x="0" y="0" class="num">3</text>
    <text x="0" y="22" class="text">Issues</text>
    <text x="0" y="38" class="mono">opened</text>
  </g></g>
  <g transform="translate(272, 180)"><g class="rise" style="animation-delay:500ms">
    <text x="0" y="0" class="num">27</text>
    <text x="0" y="22" class="text">Followers</text>
    <text x="0" y="38" class="mono">on GitHub</text>
  </g></g>
</svg>
